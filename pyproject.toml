[project]
name = "fitness-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0", "fastmcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
